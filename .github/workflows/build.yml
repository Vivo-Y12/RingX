name: Build RingX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Official vJoy 2.1.9.1 driver (jshafer817/vJoy release asset).
  # Pinned URL + SHA-256: if upstream ever changes, this build fails loudly
  # instead of shipping an unverified driver.
  VJOY_URL: https://github.com/jshafer817/vJoy/releases/download/v2.1.9.1/vJoySetup.exe
  VJOY_SHA256: f103ced4e7ff7ccb49c8415a542c56768ed4da4fea252b8f4ffdac343074654a
  # The x64 vJoyInterface.dll inside that installer (official vJoy SDK component).
  VJOY_DLL_SHA256: 4a48db89c3158cf54aca298d77f9a14579ab11acc648199e474c1092e7ee5944

jobs:
  tests:
    name: Portable test suite (80 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the ringx portable test suite
        run: python3 portable/tests/test_ringx.py

  windows-app:
    name: Windows receiver (ringx.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the app icon (Runner.rc input)
        run: |
          python -m pip install pillow
          python tool\make_icon.py

      - name: Pub get
        run: flutter pub get

      - name: Dart unit tests
        run: flutter test

      - name: Build release exe
        run: flutter build windows --release

      - name: Package the exe folder
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\RingX-app-windows.zip

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingX-app-windows
          path: RingX-app-windows.zip
          if-no-files-found: error

  android-apk:
    name: Android controller APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept the Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate the launcher icons (mipmap PNGs are not stored in git)
        run: |
          python -m pip install pillow
          python tool/make_icon.py --android

      - name: Restore the release keystore (stable signature across builds)
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/ringx-release.keystore
            android/key.properties
          key: ringx-release-keystore-v1

      - name: Create the keystore when missing
        run: |
          if [ ! -f "$HOME/.android/ringx-release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/ringx-release.keystore" \
              -storetype PKCS12 -storepass ringx0200 -alias ringx \
              -keypass ringx0200 -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=RingX, OU=Controller, O=RingX Project, C=IN"
          fi
          printf 'storeFile=%s\nstorePassword=ringx0200\nkeyAlias=ringx\nkeyPassword=ringx0200\n' \
            "$HOME/.android/ringx-release.keystore" > android/key.properties

      - name: Build the release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingX-controller-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  installer:
    name: One-click installer (RingX-Setup)
    runs-on: windows-latest
    needs: windows-app
    steps:
      - uses: actions/checkout@v4

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: RingX-app-windows
          path: app-build

      - name: Place the app where RingX.iss expects it
        shell: pwsh
        run: |
          $dst = "app\build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path app-build\RingX-app-windows.zip -DestinationPath $dst -Force
          Get-ChildItem $dst | Select-Object Name, Length

      - name: Generate the app icon (SetupIconFile input)
        run: |
          python -m pip install pillow
          python app\tool\make_icon.py

      - name: Fetch the official vJoy 2.1.9.1 driver (SHA-256 verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\drivers | Out-Null
          curl.exe -L --fail -o installer\drivers\vJoySetup.exe "$env:VJOY_URL"
          $hash = (Get-FileHash -Algorithm SHA256 "installer\drivers\vJoySetup.exe").Hash.ToLower()
          if ($hash -ne $env:VJOY_SHA256) {
            throw "vJoy driver SHA-256 mismatch: got $hash, expected $env:VJOY_SHA256"
          }
          Write-Host "vJoy 2.1.9.1 driver verified: $hash"

      - name: Build RingX-Setup-0.2.0.exe (Inno Setup 6, preinstalled on the runner)
        run: iscc installer\RingX.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingX-setup-windows
          path: dist\RingX-Setup-0.2.0.exe
          if-no-files-found: error

  portable-zip:
    name: Portable edition (zip, vJoy bundled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the official vJoy 2.1.9.1 driver (SHA-256 verified)
        run: |
          mkdir -p portable/drivers
          curl -L --fail -o portable/drivers/vJoySetup.exe "$VJOY_URL"
          echo "$VJOY_SHA256  portable/drivers/vJoySetup.exe" | sha256sum -c -

      - name: Extract the official x64 vJoyInterface.dll (SHA-256 verified)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq innoextract
          innoextract -e -d vjoy-src portable/drivers/vJoySetup.exe
          dll="$(find vjoy-src -iname 'vJoyInterface.dll' -ipath '*x64*' | head -n 1)"
          if [ -z "$dll" ]; then
            echo "::error::x64 vJoyInterface.dll not found inside the official installer"
            find vjoy-src -iname 'vJoyInterface.dll' || true
            exit 1
          fi
          echo "$VJOY_DLL_SHA256  $dll" | sha256sum -c -
          mkdir -p portable/bin
          cp "$dll" portable/bin/vJoyInterface.dll
          ls -la portable/bin portable/drivers

      - name: Zip the portable edition
        run: zip -r RingX-portable.zip portable

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: RingX-portable
          path: RingX-portable.zip
          if-no-files-found: error
